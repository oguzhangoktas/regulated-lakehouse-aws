# Exposure-level input consumed by the vendor credit-risk RWA engine.
# The engine is a black box; this contract is the boundary this platform owns.
contract: credit_risk_exposure_input
version: 1.0.0
producer: domains/credit_risk
consumer: vendor RWA engine
grain: [exposure_id, reporting_date]
frequency: monthly, on the month-end snapshot
scope: outstanding_amount > 0 OR status = 'defaulted'   # ADR-003

fields:
  - name: reporting_date
    type: date
    required: true
    description: month-end date the figures are as of, not the date the job ran
  - name: exposure_id
    type: string
    required: true
  - name: customer_id
    type: string
    required: true
    pii: pseudonymised
  - name: exposure_class
    type: string
    required: true
    allowed: [retail_other]
  - name: original_amount
    type: decimal(18,2)
    required: true
    min: 0
  - name: outstanding_amount
    type: decimal(18,2)
    required: true
    min: 0
    description: EAD basis, drawn balance as of reporting_date
  - name: undrawn_amount
    type: decimal(18,2)
    required: true
    min: 0
    description: CCF input, zero for term loans
  - name: currency
    type: string
    required: true
    allowed: [USD]
  - name: rating_grade
    type: string
    required: true
    allowed: [A, B, C, D, E, F, G]
  - name: rating_subgrade
    type: string
    required: true
  - name: origination_date
    type: date
    required: true
  - name: maturity_date
    type: date
    required: true
  - name: term_months
    type: int
    required: true
    allowed: [36, 60]
  - name: interest_rate
    type: decimal(6,4)
    required: true
    min: 0
  - name: status
    type: string
    required: true
    allowed: [performing, past_due, defaulted]
  - name: days_past_due
    type: int
    required: true
    min: 0
  - name: default_flag
    type: boolean
    required: true
  - name: default_date
    type: date
    required: false
  - name: provision_amount
    type: decimal(18,2)
    required: true
    min: 0
    description: specific provisions, netted for defaulted exposures
  - name: collateral_flag
    type: boolean
    required: true
    description: false for unsecured consumer lending
  - name: collateral_value
    type: decimal(18,2)
    required: true
    min: 0
  - name: purpose
    type: string
    required: true
  - name: region
    type: string
    required: true

# SQL predicates evaluated per row. A row failing any of these is quarantined and the
# rest of the dataset publishes.
row_rules:
  reporting_date_is_month_end: reporting_date = last_day(reporting_date)
  outstanding_within_original: outstanding_amount <= original_amount * 1.1
  defaulted_carries_flag: (status = 'defaulted') = default_flag
  past_due_has_days: status != 'past_due' OR days_past_due > 0
  defaulted_at_ninety_days: status != 'defaulted' OR days_past_due >= 90
  provision_within_outstanding: provision_amount <= outstanding_amount
  provision_only_when_defaulted: status = 'defaulted' OR provision_amount = 0
  default_date_when_defaulted: status != 'defaulted' OR default_date IS NOT NULL
  maturity_after_origination: maturity_date > origination_date

# Evaluated over the dataset. A failure means the dataset is wrong as a whole and
# nothing publishes.
dataset_assertions:
  unique_grain: true
  max_quarantine_pct: 1.0
