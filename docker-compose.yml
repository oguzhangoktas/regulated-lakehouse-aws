services:
  # Flink cluster: a JobManager (coordinator) and a TaskManager (worker), the real
  # deployment shape. The sweep rule runs here as a second engine reading the same
  # Kafka topic Spark reads, to show one detection logic across two engines. In
  # production this is a managed Flink (Kinesis Data Analytics / self-managed on K8s).
  flink-jobmanager:
    build: ./docker/flink
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
    volumes:
      - ./domains/txn_monitoring/flink:/opt/flink/jobs

  flink-taskmanager:
    build: ./docker/flink
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
    volumes:
      - ./domains/txn_monitoring/flink:/opt/flink/jobs

  # Kafka broker in KRaft mode (no ZooKeeper). This is the event stream transactions
  # flow through. In production this is AWS MSK, which is Kafka-compatible, so the
  # producer and consumers use the same API.
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: oglh-txn-monitoring-cluster
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      retries: 5

  # Creates the topic once the broker is healthy, then exits. Partitioned so the
  # stream processor can consume in parallel; keyed by account downstream so an
  # account's transactions land on one partition and stateful rules see them in order.
  kafka-init:
    image: confluentinc/cp-kafka:7.7.1
    depends_on:
      kafka:
        condition: service_healthy
    command: ["kafka-topics", "--bootstrap-server", "kafka:29092", "--create", "--if-not-exists", "--topic", "transactions", "--partitions", "6", "--replication-factor", "1"]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: lakehouse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "dev"]
      interval: 5s
      retries: 5

  airflow:
    image: apache/airflow:2.10.3-python3.11
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://dev:dev@postgres:5432/airflow
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      # Job names and table names the DAG needs, passed as env rather than hardcoded.
      OGLH_REGION: eu-central-1
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs
    command: >
      bash -c "
      pip install --quiet apache-airflow-providers-amazon==8.28.0 &&
      airflow db migrate &&
      airflow users create --username admin --password admin
        --firstname a --lastname a --role Admin --email a@a.com 2>/dev/null;
      airflow standalone
      "

volumes:
  pgdata:
  airflow-logs:
